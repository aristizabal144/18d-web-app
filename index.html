<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/favicon.ico" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema de Gestión – Joyería y Diseño 3D</title>
  <meta name="description" content="Plataforma de gestión para joyería y diseño 3D profesional." />
  <link rel="stylesheet" type="text/css" href="/loader.css" />
</head>

<body>
  <div id="app">
    <div id="loading-bg">
      <div class="loading-logo">
        <!-- Anillo solitario (mismo diseño que src/assets/images/logo.svg) -->
        <svg width="80" height="80" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" style="color: var(--initial-loader-color)">
          <circle cx="16" cy="21" r="8.5" stroke="currentColor" stroke-width="2.5"/>
          <path d="M12 2.5H20L23.5 6.5L16 11.5L8.5 6.5L12 2.5Z" fill="currentColor" fill-opacity="0.25" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
          <path d="M8.5 6.5H23.5M12 2.5L14 6.5L16 11.5L18 6.5L20 2.5" stroke="currentColor" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
        </svg>
        <div id="loading-brand-name" class="loading-brand-name"></div>
        <div id="loading-brand-tagline" class="loading-brand-tagline"></div>
      </div>
      <div class="loading">
        <div class="effect-1 effects"></div>
        <div class="effect-2 effects"></div>
        <div class="effect-3 effects"></div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
  <script>
    // Colores del loader: fondo oscuro y primario del negocio
    const storedBg = localStorage.getItem('18d-joyeros-initial-loader-bg')
    const storedColor = localStorage.getItem('18d-joyeros-initial-loader-color')

    // Caché de la configuración del negocio (lo escribe useNegocioStore con el prefijo storageNamespace de themeConfig.ts)
    let negocio = {}
    try {
      negocio = JSON.parse(localStorage.getItem('18D JOYEROS-negocio') || '{}') || {}
    }
    catch (e) {}

    const isHex = value => typeof value === 'string' && /^#[0-9a-f]{6}$/i.test(value)
    const brandColor = isHex(negocio.color_primario) ? negocio.color_primario : null

    // Default to dark brand colors if no stored preference
    const loaderBg = storedBg || '#141414'
    const loaderColor = brandColor || storedColor || '#C9A84C'

    document.documentElement.style.setProperty('--initial-loader-bg', loaderBg)
    document.documentElement.style.setProperty('--initial-loader-color', loaderColor)

    // Set text color based on background
    const isDark = loaderBg === '#141414' || loaderBg.startsWith('#1') || loaderBg.startsWith('#0')
    document.documentElement.style.setProperty('--initial-loader-text', isDark ? loaderColor : '#1E1B16')

    // Nombre del negocio: primera palabra como marca, el resto como subtítulo
    if (typeof negocio.nombre_comercial === 'string' && negocio.nombre_comercial.trim()) {
      const [marca, ...resto] = negocio.nombre_comercial.trim().toUpperCase().split(/\s+/)
      document.getElementById('loading-brand-name').textContent = marca
      document.getElementById('loading-brand-tagline').textContent = resto.join(' ')
      document.title = negocio.nombre_comercial.toUpperCase() + ' – Diseño 3D'
    }
  </script>
</body>
</html>
